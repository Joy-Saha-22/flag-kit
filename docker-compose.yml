services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
       - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_DEMO_CLIENT_SDK_KEY: ${VITE_DEMO_CLIENT_SDK_KEY:-}
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      SERVE_CLIENT: "true"
      MONGODB_URI: ${MONGODB_URI_DOCKER}
      REDIS_URL: ${REDIS_URL_DOCKER}
    ports:
      - "${API_PORT:-3001}:3000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
